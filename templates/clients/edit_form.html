{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block brand %}Customer{% endblock %}
{% block content %}
<section class="card">
  <p><a href="{% url 'clients:detail' customer.pk %}">← {{ customer.name }}</a></p>
  <h1>{{ heading }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
</section>
{% endblock %}
