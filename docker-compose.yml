services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wccrm
      POSTGRES_USER: wccrm
      POSTGRES_PASSWORD: wccrm
    ports:
      - "5432:5432"
    volumes:
      - wccrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wccrm -d wccrm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wccrm_pgdata:
