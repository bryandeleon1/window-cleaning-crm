services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wccrm
      POSTGRES_USER: wccrm
      POSTGRES_PASSWORD: wccrm
    ports:
      - "5432:5432"
    volumes:
      - wccrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wccrm -d wccrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://wccrm:wccrm@db:5432/wccrm
    depends_on:
      db:
        condition: service_healthy
    # Example one-shot bootstrap (run manually when needed):
    # docker compose run --rm web python manage.py migrate
    # docker compose run --rm web python manage.py seed_demo

volumes:
  wccrm_pgdata:
